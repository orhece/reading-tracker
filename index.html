<style>
:root{
  --bg:#f2f2f7; --card:#fff; --ink:#000; --mute:#8e8e93; --line:#d1d1d6;
  --accent:#C6FF8C; --on-accent:#000; --accent-ink:#2f7d00; --hit:#8fd94f; --left:#8fd94f; --matter:#e5e5ea; --err:#ff3b30;
  --top:calc(env(safe-area-inset-top) + 36px);
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --ink:#fff; --line:#38383a; --accent-ink:#C6FF8C; --hit:#C6FF8C; --left:#5d7d3c; --matter:#2c2c2e; --err:#ff453a; }
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%;text-transform:capitalize}
body.modal{overflow:hidden}
button,input,select{font:inherit;text-transform:capitalize}
input:focus,textarea:focus{outline:none}
::selection{background:var(--accent);color:#000}

/* ---------- page frame ---------- */
main{max-width:560px;margin:0 auto;padding:var(--top) 16px calc(100px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.view:not([hidden]){flex:1;display:flex;flex-direction:column}
h1{font-size:28px;line-height:1.15;margin:0 0 10px;font-weight:700}
.sub{color:var(--mute);margin:-8px 0 10px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:19px;line-height:1.3;margin:0 0 8px;font-weight:700}
h3{font-size:13px;font-weight:400;color:var(--mute);margin:14px 0 2px}
.hint{color:var(--mute);font-size:15px;margin:10px 0 0}
.warn{color:var(--err);font-size:15px;margin:10px 0 0}

/* top bar: every button is the same size; the right group splits evenly */
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:36px;margin-bottom:4px}
.rgrp{display:flex;gap:8px;width:228px}
.rgrp>#topSeg{flex:1;display:flex}
.rgrp>#topSeg[hidden]{display:none}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:10px;padding:14px;margin-top:12px}
.card.fill{flex:1;margin-top:0;padding:12px 14px}

/* ---------- buttons ---------- */
.pill{border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;padding:9px 16px;cursor:pointer}
.pill.sm{width:110px;height:36px;padding:0;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.rgrp .pill.sm{width:auto;flex:1}
.pill.sm svg{width:16px;height:16px}
.pill.wide{display:block;width:100%;margin-top:12px;padding:12px 0;font-size:17px}
.pill.armed{background:var(--err);color:#fff}
.danger{display:block;width:100%;margin-top:12px;padding:12px 0;border:0;border-radius:10px;background:var(--bg);color:var(--err);font-weight:600;font-size:17px;cursor:pointer}
.danger.armed{background:var(--err);color:#fff}
.btnrow{display:flex;gap:8px;margin-top:8px}
.ext{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.ext .pill{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0;border-radius:16px}
.ext .pill small{font-weight:400;font-size:12px;opacity:.65}

/* pages / percent switch */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:100%;height:36px;padding:2px;background:var(--matter);border-radius:999px}
.seg button{border:0;background:transparent;color:var(--ink);font-size:15px;border-radius:999px;cursor:pointer;padding:0}
.seg button.on{background:var(--accent);color:#000;font-weight:600}

/* ---------- today: log box ---------- */
.lpbig{display:flex;align-items:baseline;gap:4px;margin:2px 0 0}
.lpbig .pre,.lpbig .suf{font-size:1.4rem;color:var(--accent-ink)}
#lpv{width:5ch;font-size:2.5rem;font-weight:700;text-align:left;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;color:var(--accent-ink);padding:0}
#lpv.pct{width:3.5ch}
.lpbig .of{margin-left:10px;color:var(--mute);font-size:15px}
#logBox:not([hidden])+#chk:not(:empty){margin-top:10px;padding-top:8px;border-top:0.5px solid var(--line)}

/* ---------- numbers + detail rows ---------- */
.answer{margin:0 0 2px}
.answer .n{font-size:2.2rem;font-weight:700;line-height:1;color:var(--accent-ink);letter-spacing:-.02em}
.answer .n.sm{font-size:2.2rem}
.answer .u{display:inline-block;font-size:1.05rem;margin-left:6px;color:var(--accent-ink)}
.answer p{margin:2px 0 0;font-size:14px;line-height:1.3}
dl{display:grid;grid-template-columns:1fr auto;margin:10px 0 0;border-top:0.5px solid var(--line)}
dt,dd{margin:0;padding:6px 0;border-bottom:0.5px solid var(--line);line-height:1.3}
dt{font-size:14px}
dd{font-weight:600;font-size:15px;text-align:right;color:var(--accent-ink);padding-left:12px}
dt small,dd small{display:block;font-weight:400;font-size:12px;color:var(--mute);line-height:1.3}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px}
.tile{background:var(--bg);border-radius:10px;padding:6px 9px}
.tile.wide{grid-column:1/-1}
.tl{font-size:12px;color:var(--mute);line-height:1.25}
.tv{font-weight:600;font-size:15px;line-height:1.25;color:var(--accent-ink);margin-top:2px}
.tv small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.line{margin:0 0 10px}.line b{color:var(--accent-ink)}

/* ---------- progress: bar + charts ---------- */
.prog{display:flex;align-items:center;gap:10px}
.track{flex:1;height:8px;border-radius:4px;background:var(--matter);overflow:hidden}
.track i{display:block;height:100%;background:var(--hit)}
.prog span{color:var(--accent-ink);font-weight:600;font-size:15px}
.chart{display:flex;gap:8px;overflow-x:auto;padding:8px 4px 2px;margin-top:4px}
.col{flex:0 0 24px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px}
.col[data-k]{cursor:pointer}
.bw{height:84px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.v{color:var(--mute);white-space:nowrap}
.bar{display:block;width:16px;border-radius:8px;background:var(--matter)}
.bar.hit{background:var(--hit)}
.bar.fut{background:transparent;border:1.5px dashed var(--left)}
.col.sel .bar{outline:2px solid var(--ink);outline-offset:2px}
.dot{width:6px;height:6px;border-radius:50%}
.today .dot{background:var(--accent-ink)}
.d{white-space:nowrap;height:1em}
.cap{margin:10px 0 0;font-size:13px;color:var(--mute)}
.lcs{width:100%;height:auto;display:block;margin-top:6px}
.lcs .gr line{stroke:var(--line)}
.lcs .gr text{fill:var(--mute);font-size:9px}
.lcs .li{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:4 4}
.lcs .la{fill:none;stroke:var(--accent-ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lcs .ld{fill:var(--accent-ink)}
.lcs .xl{fill:var(--ink);font-size:9px}

/* ---------- shelf ---------- */
.bk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--line)}
.bk:last-child{border-bottom:0}
.bk.cur{cursor:pointer;-webkit-user-select:none;user-select:none}
.bkm{flex:1;min-width:0}
.bk .t{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600}
.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bk .s{color:var(--mute);font-size:14px}
.acts{display:flex;gap:6px;flex-shrink:0}
.acts .pill{padding:6px 12px;font-size:14px}
.tag{flex:none;font-size:12px;font-weight:700;color:#000;background:var(--accent);border-radius:999px;padding:1px 8px}
.chev{flex:none;font-style:normal;font-size:22px;line-height:1;color:var(--mute);display:inline-block;transition:transform .15s}
.chev.on{transform:rotate(90deg)}
.setup{padding:2px 0 12px;border-bottom:0.5px solid var(--line)}
.setup form{background:var(--bg);border-radius:10px;overflow:hidden}
.setup label{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;padding:0 12px;font-size:17px}
.setup label+label{border-top:0.5px solid var(--line)}
.setup input{flex:1 1 40%;min-width:0;font-size:17px;text-align:right;border:0;background:none;color:var(--ink);padding:6px 0}
.setup input::placeholder{color:var(--mute)}
input[type="date"]{-webkit-appearance:none;appearance:none;display:flex;justify-content:flex-end;min-height:30px}
input[type="date"]::-webkit-date-and-time-value{text-align:right}
#out:not(:empty){background:var(--bg);border-radius:10px;padding:12px;margin-top:12px}
.opd summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.opd summary::-webkit-details-marker{display:none}
.opd summary h2{margin:0}
.opq{color:var(--accent-ink);font-weight:600;font-size:15px}
.opq i{display:inline-block;font-style:normal;margin-left:8px;color:var(--mute);transition:transform .15s}
.opd[open] .opq i{transform:rotate(90deg)}
.opd[open] .answer{margin-top:10px}

/* ---------- sheets (settings, finished) ---------- */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding:var(--top) 0 calc(24px + env(safe-area-inset-bottom));display:none;z-index:20}
.sheet.open{display:block}
.sbar{position:relative;display:flex;justify-content:flex-end;align-items:center;min-height:36px;max-width:560px;margin:0 auto 6px;padding:0 16px}
.sbar>b{position:absolute;left:50%;transform:translateX(-50%);font-size:17px}
.sheet .inner{max-width:560px;margin:0 auto;padding:0 16px}
.sheet .card:first-child{margin-top:0}
textarea{font:inherit;font-size:13px;text-transform:none;width:100%;min-height:110px;margin-top:10px;background:var(--bg);color:var(--ink);border:0;border-radius:10px;padding:10px}
input[type="file"]{margin-top:10px;font-size:14px;padding:8px 0;text-transform:none;color:var(--ink)}

/* ---------- floating tab bar ---------- */
.tabs{position:fixed;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:520px;margin:0 auto;display:flex;padding:5px;border-radius:999px;z-index:5;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border:0.5px solid rgba(0,0,0,.08);box-shadow:0 6px 24px rgba(0,0,0,.12)}
@media (prefers-color-scheme: dark){.tabs{background:rgba(40,40,42,.72);border-color:rgba(255,255,255,.1)}}
.tabs button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:999px;background:transparent;color:var(--ink);font-size:11px;font-weight:500;padding:4px 0;cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button.on{background:var(--accent);color:#000;font-weight:600}
button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* ---------- undo toast ---------- */
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:528px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#333;color:#fff;border-radius:12px;padding:6px 6px 6px 14px;min-height:44px;z-index:30;font-size:15px}
#toast button{font-weight:600;color:var(--accent);background:none;border:0;padding:8px;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <span><button type="button" class="pill sm" id="setBtn" hidden>settings</button></span>
    <span class="rgrp"><span id="topSeg" hidden></span><button type="button" class="pill sm" id="newBtn" hidden>new book +</button><button type="button" class="pill sm" id="finBtn" hidden>finished</button></span>
  </div>
  <h1>Reading tracker</h1>
  <p class="sub" id="bt" hidden></p>

  <nav class="tabs" role="tablist" aria-label="sections">
    <button type="button" role="tab" data-tab="T"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>today</button>
    <button type="button" role="tab" data-tab="L"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-12"/></svg>progress</button>
    <button type="button" role="tab" data-tab="S"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="4" height="16" rx="1"/><rect x="9.5" y="4" width="4" height="16" rx="1"/><path d="M15.6 5.3l3.2-.9 3.4 15.1-3.2.9z"/></svg>shelf</button>
  </nav>

  <!-- TODAY: log today's page, then today's numbers -->
  <div class="view" id="vT" role="tabpanel" hidden>
    <section class="card fill">
      <div id="logBox" hidden>
        <h2 id="lpq" style="margin-bottom:2px">what page did you end at?</h2>
        <div class="lpbig"><span class="pre" id="lpPre">p.</span><input id="lpv" type="number" inputmode="numeric" step="1" min="0" aria-label="page you ended at"><span class="suf" id="lpSuf" hidden>%</span><span class="of" id="lppct"></span></div>
        <div class="btnrow">
          <button type="button" class="pill sm" id="lpsave">save progress</button>
          <button type="button" class="pill sm" id="syncW">widget<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
          <button type="button" class="pill sm" id="lpcancel" hidden>cancel</button>
        </div>
      </div>
      <div id="chk"></div>
    </section>
  </div>

  <!-- PROGRESS: plan, daily bars, pace chart -->
  <div class="view" id="vL" role="tabpanel" hidden>
    <section class="card fill" id="plan"></section>
  </div>

  <!-- SHELF: current book (tap to edit its setup), other books -->
  <div class="view" id="vS" role="tabpanel" hidden>
    <section class="card fill">
      <h2>reading now</h2>
      <div id="shCur"></div>
      <div class="setup" id="setupWrap" hidden>
        <form id="f" onsubmit="return false" novalidate>
          <label>book title<input id="title" type="text" autocomplete="off" placeholder="e.g. the secret history"></label>
          <label>total physical pages<input id="total" type="number" inputmode="numeric" min="1" placeholder="e.g. 412"></label>
          <label>story starts on page<input id="start" type="number" inputmode="numeric" min="1" placeholder="e.g. 11"></label>
          <label>story ends on page<input id="end" type="number" inputmode="numeric" min="1" placeholder="e.g. 389"></label>
          <label>page you started from<input id="cur" type="number" inputmode="numeric" min="0" placeholder="e.g. 120"></label>
          <label>start date<input id="sdate" type="date"></label>
          <label>target finish date<input id="date" type="date"></label>
          <label>minutes per page<input id="mpp" type="number" inputmode="decimal" min="0" step="0.1" placeholder="e.g. 1.5"></label>
        </form>
        <p class="warn" id="msg" role="status" aria-live="polite" hidden></p>
        <div id="out"></div>
        <button type="button" class="danger" id="delCur">delete this book</button>
      </div>
      <div id="othersWrap" hidden><h3>also reading</h3><div id="shOthers"></div></div>
    </section>
  </div>
</main>

<div class="sheet" id="finSheet" role="dialog" aria-label="finished books">
  <div class="sbar"><b>finished</b><button type="button" class="pill sm" data-close>done</button></div>
  <div class="inner"><section class="card"><div id="shDone"></div></section></div>
</div>

<div class="sheet" id="setSheet" role="dialog" aria-label="settings">
  <div class="sbar"><b>settings</b><button type="button" class="pill sm" data-close>done</button></div>
  <div class="inner">
    <section class="card">
      <h2>backup</h2>
      <p class="hint" id="bkInfo"></p>
      <div class="ext" style="margin-top:14px"><button type="button" class="pill" id="bkDl">download</button><button type="button" class="pill" id="bkCopy">copy</button><button type="button" class="pill" id="bkOpen">restore</button></div>
      <div id="bkRestore" hidden>
        <p class="hint">paste a backup below or choose a backup file. this replaces everything in the tracker on this device (you can undo right after).</p>
        <textarea id="bkText" spellcheck="false" autocapitalize="off" aria-label="backup text"></textarea>
        <input type="file" id="bkFile" accept=".json,application/json,text/plain" aria-label="backup file">
        <button type="button" class="pill wide" id="bkGo">restore this backup</button>
      </div>
      <p class="hint" id="bkMsg" role="status" aria-live="polite"></p>
    </section>
    <section class="card">
      <h2>app</h2>
      <button type="button" class="pill wide" id="updBtn" style="margin-top:4px">check for updates</button>
      <p class="hint" id="appVer"></p>
    </section>
  </div>
</div>

<div id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button type="button" id="toastUndo">undo</button></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var KEY="reading-shelf-v2",KEY_OLD="reading-goal-v1",DAY=86400000,MAXD=4000;
var FIELDS=["title","total","start","end","cur","sdate","date","mpp"];
var WIDGET_SCRIPT="Reading Tracker";

/* ================= helpers ================= */
function fmt(n){return n.toLocaleString()}
function plural(n,w){return fmt(n)+" "+w+(n===1?"":"s")}
function fmtMin(m){m=Math.round(m);if(m<60)return m+" min";var h=Math.floor(m/60),r=m%60;return h+" hr"+(r?" "+r+" min":"")}
function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function ymd(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd}
function pd(k){var q=k.split("-");return new Date(+q[0],+q[1]-1,+q[2])}
function sd(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function longD(d){return d.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function daysBetween(a,b){return Math.round((b-a)/DAY)}
function P(n,t){var v=n/t*100,r=Math.round(v);return (r===0&&v>0?"<1":String(r))+"%"}
function newId(){return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

var today=midnight(new Date());
var shelf,unit="pages";
var editKey="",lpDirty=false,lpPin=null;   // log box state
var ctx=null;                               // today's numbers for the current book (null when not set up)
var curTab="T",setupOpen=false,opOpen=false;

/* ================= books & storage ================= */
function normBook(b){
  var lg=b.log&&typeof b.log==="object"?b.log:{};
  if(typeof b.base0!=="number")b.base0=null;
  Object.keys(lg).sort().forEach(function(k){
    var v=lg[k];
    if(v&&typeof v==="object"){if(b.base0===null&&typeof v.from==="number")b.base0=v.from;lg[k]=v.to}
    if(typeof lg[k]!=="number"||!/^\d{4}-\d{2}-\d{2}$/.test(k))delete lg[k];
  });
  b.log=lg;
  if(typeof b.id!=="string")b.id=newId();
  var f=b.f&&typeof b.f==="object"?b.f:{};
  FIELDS.forEach(function(id){if(typeof f[id]!=="string")f[id]=""});
  b.f=f;
  return b;
}
function blank(){var b=normBook({id:newId(),f:{},log:{},base0:null});b.f.sdate=ymd(today);return b}
function normShelf(o){
  if(o&&typeof o==="object"&&!Array.isArray(o.books)&&("total" in o||"log" in o)){   // very old single-book format
    var ob=blank();FIELDS.forEach(function(id){if(typeof o[id]==="string")ob.f[id]=o[id]});
    if(o.log&&typeof o.log==="object")ob.log=o.log;if(typeof o.base0==="number")ob.base0=o.base0;
    o={books:[ob],cur:ob.id};
  }
  var s={books:[],cur:null,lastBackup:null};
  if(o&&Array.isArray(o.books))o.books.forEach(function(b){if(b&&typeof b==="object")s.books.push(normBook(b))});
  if(!s.books.length)s.books.push(blank());
  s.cur=o&&s.books.some(function(b){return b.id===o.cur})?o.cur:s.books[0].id;
  if(o&&typeof o.lastBackup==="string")s.lastBackup=o.lastBackup;
  s.unit=o&&o.unit==="pct"?"pct":"pages";
  return s;
}
function B(){for(var i=0;i<shelf.books.length;i++)if(shelf.books[i].id===shelf.cur)return shelf.books[i];return shelf.books[0]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(shelf))}catch(e){}}
function load(){
  var o=null;
  try{var s=localStorage.getItem(KEY)||localStorage.getItem(KEY_OLD);if(s)o=JSON.parse(s)}catch(e){}
  shelf=normShelf(o);unit=shelf.unit;
}
function fillForm(){var f=B().f;FIELDS.forEach(function(id){$(id).value=f[id]||""});editKey="";lpDirty=false}

/* ================= the math ================= */
/* everything the screens need for one book; state is setup | error | passed | done | normal */
function compute(b){
  var f=b.f,N=function(k){return f[k]===""||f[k]==null?NaN:Number(f[k])};
  var total=N("total"),start=N("start"),end=N("end"),cur=N("cur"),log=b.log;
  if([total,start,end,cur].some(isNaN)||!f.date)return {state:"setup"};
  var err="";
  if(![total,start,end,cur].every(Number.isInteger))err="Use whole page numbers.";
  else if(start<1||end<start)err="The story must end on or after the page it starts on.";
  else if(end>total)err="The story can’t end past the book’s last page ("+fmt(total)+").";
  else if(cur<0||cur>end)err="Your current page has to be between 0 and the story’s last page ("+fmt(end)+").";
  if(err)return {state:"error",err:err};
  var target=pd(f.date),startD=f.sdate?pd(f.sdate):today;
  if(startD>target)return {state:"error",err:"The start date can’t be after the target date."};
  var totDays=daysBetween(startD,target)+1,sp=Math.max(cur,start-1);
  var m={state:"normal",total:total,start:start,end:end,target:target,startD:startD,totDays:totDays,sp:sp,
         planPages:end-sp,mpp:N("mpp")};
  m.ideal=m.planPages/totDays;
  var pk=Object.keys(log).filter(function(k){return k<ymd(today)}).sort().pop();
  if(pk)cur=Math.min(end,log[pk]);                      // where you were at the end of your last logged day
  var tl=log[ymd(today)];
  m.cur=cur;m.now=tl!=null?tl:cur;m.days=daysBetween(today,target)+1;
  if(m.now>=end){m.state="done";m.perDay=0;m.goal=end;}
  else if(m.days<1){m.state="passed";m.rem=end-Math.max(m.now,start-1);return m}
  else{
    var read=cur>=start?cur-start+1:0;
    m.left=(end-start+1)-read;m.perDay=Math.ceil(m.left/m.days);
    m.goal=Math.min(end,Math.max(cur,start-1)+m.perDay);
  }
  m.ctx={total:total,start:start,end:end,cur:cur,now:m.now,goalPg:m.goal,done:m.state==="done"};
  return m;
}
/* stats for any book on the shelf */
function analyze(b){
  var m=compute(b);if(m.state==="setup"||m.state==="error")return null;
  var lg=b.log,keys=Object.keys(lg).sort(),prev=typeof b.base0==="number"?b.base0:m.sp,best=0,bestK=null,finK=null;
  keys.forEach(function(k){var v=lg[k],dl=Math.max(0,v-prev);if(dl>best){best=dl;bestK=k}if(v>=m.end&&!finK)finK=k;prev=v});
  var latest=keys.length?lg[keys[keys.length-1]]:m.sp;
  var startD=b.f.sdate?pd(b.f.sdate):(keys.length?pd(keys[0]):today);
  var daysTaken=finK?Math.max(1,daysBetween(startD,pd(finK))+1):null;
  var at=Math.max(Math.min(latest,m.end),m.start-1);
  return {done:latest>=m.end,finK:finK,daysTaken:daysTaken,pages:m.planPages,avg:daysTaken&&m.planPages>0?m.planPages/daysTaken:null,
    best:best,bestK:bestK,storyPct:Math.round((at-(m.start-1))/(m.end-m.start+1)*100),target:m.target};
}
function isReady(){var s=compute(B()).state;return s!=="setup"&&s!=="error"}

/* ================= today: log box ================= */
function startPage(){return Math.max(ctx.cur,ctx.start-1)}
function pageFor(k){
  var log=B().log;if(log[k]!=null)return log[k];
  var pk=Object.keys(log).filter(function(x){return x<k}).sort().pop();
  return pk?log[pk]:(B().base0!==null?B().base0:startPage());
}
function toUnit(page){return unit==="pct"?Math.round(page/ctx.total*100):page}
function lpPage(){var v=parseFloat($("lpv").value);if(isNaN(v)||!ctx)return NaN;return Math.round(unit==="pct"?v/100*ctx.total:v)}
function updPct(){
  var v=parseFloat($("lpv").value);
  if(isNaN(v)||!ctx){$("lppct").textContent="";return}
  $("lppct").textContent=unit==="pct"?"page "+fmt(lpPin!=null?lpPin:lpPage())+" of "+fmt(ctx.total):P(v,ctx.total)+" of book";
}
function renderLog(){
  if(!ctx){$("logBox").hidden=true;return}
  $("logBox").hidden=false;
  var pc=unit==="pct",k=editKey||ymd(today),isT=k===ymd(today),q=pc?"what percent are you at?":"what page did you end at?";
  $("lpq").textContent=isT?q:"editing "+sd(pd(k))+" · "+q;
  $("lpPre").hidden=pc;$("lpSuf").hidden=!pc;
  var inp=$("lpv");inp.classList.toggle("pct",pc);
  inp.setAttribute("aria-label",pc?"percent of the book you’re at":"page you ended at");
  $("lpcancel").hidden=isT;
  if(document.activeElement!==inp&&!lpDirty){lpPin=pageFor(k);inp.value=toUnit(lpPin)}
  updPct();
}
function saveLp(){
  var p=lpPin!=null?lpPin:lpPage();if(isNaN(p)||!ctx)return;
  var b=B(),k=editKey||ymd(today);
  if(b.base0===null)b.base0=startPage();
  b.log[k]=Math.max(ctx.start-1,Math.min(ctx.end,p));
  lpDirty=false;editKey="";$("lpv").blur();render();save();
}

/* ================= today: numbers ================= */
function setupPrompt(text,isErr){
  return '<p class="'+(isErr?'warn':'hint')+'" style="margin-top:0">'+text+'</p><button type="button" class="pill wide" data-go="setup">'+(isErr?"fix it in setup":"set up this book")+'</button>';
}
function passedHTML(m){
  var opts=[[7,"1 week"],[14,"2 weeks"],[30,"1 month"]].map(function(o){
    return '<button type="button" class="pill" data-ext="'+o[0]+'">'+o[1]+'<small>'+fmt(Math.ceil(m.rem/o[0]))+' pages/day</small></button>'}).join("");
  return '<div class="answer"><div class="n sm">New date?</div><p>Your target date ('+longD(m.target)+') has passed, and you have '+plural(m.rem,'story page')+
    ' left. Pick a new finish date and the plan will recalculate.</p></div><p class="hint">finish in…</p><div class="ext">'+opts+'</div><p class="hint">or choose any date in the book’s setup on the shelf.</p>';
}
function doneHTML(){
  var b=B(),t=b.f.title.trim(),st=analyze(b),finD=st&&st.finK?pd(st.finK):null;
  var h='<div class="answer"><div class="n">Done</div><p>You finished '+(t?esc(t):'the story')+(finD?' on '+longD(finD):'')+'. Nice work.</p></div><dl>';
  if(st&&st.daysTaken)h+='<dt>Days it took</dt><dd>'+fmt(st.daysTaken)+'</dd>';
  if(st&&st.pages>0)h+='<dt>Pages read</dt><dd>'+fmt(st.pages)+'</dd>';
  if(st&&st.avg!=null)h+='<dt>Average</dt><dd>'+st.avg.toFixed(1)+' pages a day</dd>';
  if(st&&st.bestK)h+='<dt>Best day</dt><dd>'+plural(st.best,'page')+' on '+sd(pd(st.bestK))+'</dd>';
  if(finD){var dfd=daysBetween(finD,st.target);h+='<dt>Vs. your target</dt><dd>'+(dfd>0?plural(dfd,'day')+' early':dfd===0?'right on time':plural(-dfd,'day')+' late')+'</dd>'}
  return h+'</dl><button type="button" class="pill wide" data-act="new">start your next book</button>';
}
function checkinHTML(m){
  var total=m.total,pc=unit==="pct",hasT=m.mpp>0,mpp=m.mpp;
  var at=Math.max(m.now,m.start-1),toGo=m.goal-at,leftAll=m.end-at;
  var A=function(n){return pc?P(n,total):plural(n,'page')};
  var h;
  if(toGo>0)h=pc?'<div class="answer"><span class="n">'+P(toGo,total)+'</span><span class="u">left today</span><p>About '+plural(toGo,'page')+(hasT?', '+fmtMin(toGo*mpp)+' of reading':'')+'.</p></div>'
    :'<div class="answer"><span class="n">'+fmt(toGo)+'</span><span class="u">page'+(toGo===1?'':'s')+' left today</span><p>That’s '+P(toGo,total)+' of the book'+(hasT?', about '+fmtMin(toGo*mpp)+' of reading':'')+'.</p></div>';
  else h='<div class="answer"><div class="n">Goal hit</div><p>'+(toGo<0?A(-toGo)+' ahead of today’s goal.':'You’re right on today’s goal.')+'</p></div>';
  var el=m.startD<=today?daysBetween(m.startD,today)+1:0,ip=Math.round(m.sp+m.ideal*Math.min(el,m.totDays)),df=at-ip;
  /* detail tiles: label, value, small note under the value */
  var tile=function(l,v,note,wide){return '<div class="tile'+(wide?' wide':'')+'"><div class="tl">'+l+'</div><div class="tv">'+v+(note?'<small>'+note+'</small>':'')+'</div></div>'};
  var rate=function(x){var t=hasT?'about '+fmtMin(x*mpp):'';return pc?[P(x,total)+' a day',x.toFixed(1)+' pages'+(t?' · '+t:'')]:[x.toFixed(1)+' pages a day',P(x,total)+(t?' · '+t:'')]};
  var spot=function(n){return pc?[P(n,total),'page '+fmt(n)]:['Page '+fmt(n),P(n,total)]};
  var g=spot(m.goal),w=spot(m.now),r1=rate(m.left/m.days),r3=rate(m.ideal);
  h+='<div class="tiles">'+tile('Today’s goal',g[0],g[1])+tile('Where you are',w[0],w[1])+
    tile('Needed per day from today',r1[0],r1[1]+' · '+plural(m.days,'day')+' left');
  if(m.days>1){var r2=rate(leftAll/(m.days-1));h+=tile('Needed per day after today',r2[0],r2[1]+' · uses today’s reading')}
  else h+=tile('Days after today','None','');
  h+=tile('Ideal pace (original plan)',r3[0],r3[1])+
    tile('Ideal spot by tonight',pc?P(ip,total):'Page '+fmt(ip),df===0?'right on pace':(df>0?'ahead by ':'behind by ')+A(Math.abs(df)))+
    tile('Story left overall',A(leftAll),(pc?plural(leftAll,'page'):P(leftAll,total))+(hasT?' · about '+fmtMin(leftAll*mpp):''),true)+'</div>';
  return h;
}
function renderToday(m){
  var c=$("chk");
  if(m.state==="setup")c.innerHTML=setupPrompt("finish setting up this book to see today’s goal.");
  else if(m.state==="error")c.innerHTML=setupPrompt(m.err,true);
  else if(m.state==="passed")c.innerHTML=passedHTML(m);
  else if(m.state==="done")c.innerHTML=doneHTML();
  else c.innerHTML=checkinHTML(m);
}

/* ================= progress tab ================= */
function lineChart(m,log){
  var W=340,H=124,L=40,R=40,T=8,Bm=20,iw=W-L-R,ih=H-T-Bm,sp=m.sp,ep=m.end,den=Math.max(1,ep-sp),days=[],d,i;
  for(d=new Date(m.startD),i=0;d<=m.target&&i<MAXD;i++,d=addDays(d,1))days.push(d);
  var n=days.length;if(n<2)return"";
  function Y(p){return (T+ih*(1-(Math.min(Math.max(p,sp),ep)-sp)/den)).toFixed(1)}
  function X(j){return (L+iw*(j+1)/n).toFixed(1)}
  var s='<p class="cap">progress vs ideal pace</p><svg class="lcs" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="progress compared with ideal pace"><g class="gr">';
  [0,.5,1].forEach(function(f){
    var p=sp+den*f,y=Y(p);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(+y+3)+'" text-anchor="end">'+Math.round(p)+'</text><text x="'+(W-R+6)+'" y="'+(+y+3)+'">'+Math.round(p/m.total*100)+'%</text>';
  });
  s+='</g><line class="li" x1="'+L+'" y1="'+Y(sp)+'" x2="'+(W-R)+'" y2="'+Y(ep)+'"/>';
  var prev=sp,lx=L,ly=Y(sp),pts=[lx+','+ly];
  days.forEach(function(dd,j){if(dd>today)return;var e=log[ymd(dd)];if(e!=null)prev=e;lx=X(j);ly=Y(prev);pts.push(lx+','+ly)});
  s+='<polyline class="la" points="'+pts.join(' ')+'"/><circle class="ld" cx="'+lx+'" cy="'+ly+'" r="4"/>';
  return s+'<text class="xl" x="'+L+'" y="'+(H-6)+'">'+sd(days[0])+'</text><text class="xl" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+sd(days[n-1])+'</text></svg>';
}
function renderPlan(m){
  var el=$("plan");
  if(m.state==="setup"){el.innerHTML='<h2>reading plan</h2>'+setupPrompt("finish setting up this book to see your plan.");return}
  if(m.state==="error"){el.innerHTML='<h2>reading plan</h2>'+setupPrompt(m.err,true);return}
  if(m.state==="passed"){el.innerHTML='<h2>reading plan</h2>'+passedHTML(m);return}
  var b=B(),log=b.log,tk=ymd(today),done=m.state==="done";
  var f=unit==="pct"?100/m.total:1,goalPct=m.ideal*f,mx=Math.max(goalPct*1.25,1),cols=[],i,d,e,pg,v,tp=0;
  var prev=b.base0===null?Math.max(m.cur,m.start-1):b.base0;   /* page before the first logged day */
  for(i=0,d=new Date(m.startD);d<=m.target&&i<MAXD;i++,d=addDays(d,1)){
    e=log[ymd(d)];pg=0;if(e!=null){pg=Math.max(0,e-prev);prev=e}
    v=pg*f;if(ymd(d)===tk)tp=pg;
    cols.push({d:d,k:ymd(d),v:v,fut:d>today});if(v>mx)mx=v;
  }
  function lbl(x){return unit==="pct"&&x>0&&x<.5?"<1":String(Math.round(x))}
  var cp=Math.min(m.end,Math.max(m.now,m.start-1)),h='<h2>reading plan</h2>';
  if(done){var st=analyze(b);h+='<p class="line"><b>finished</b> the story'+(st&&st.finK?' on '+sd(pd(st.finK)):'')+'. tap any bar to fix a day.</p>'}
  else h+=unit==="pct"?'<p class="line"><b>'+P(tp,m.total)+'</b> of '+P(m.perDay,m.total)+' today → <b>'+P(m.goal,m.total)+'</b></p>'
    :'<p class="line"><b>'+fmt(tp)+'</b> of '+fmt(m.perDay)+' pages today → page <b>'+fmt(m.goal)+'</b></p>';
  h+='<div class="prog"><div class="track"><i style="width:'+(cp/m.total*100).toFixed(1)+'%"></i></div><span>'+Math.round(cp/m.total*100)+'%</span></div>'+
    '<dl><dt>finish by</dt><dd>'+longD(m.target)+'</dd><dt>ideal pace</dt><dd>'+m.ideal.toFixed(1)+' pages ('+P(m.ideal,m.total)+') a day</dd><dt>started</dt><dd>'+sd(m.startD)+'</dd></dl><div class="chart">';
  cols.forEach(function(c,j){
    var isT=c.k===tk,hide=c.fut&&done,hg=hide?0:(c.fut?goalPct/mx*100:Math.max(c.v/mx*100,3));
    var cls=hide?"":(c.fut?"fut":(c.v>=goalPct?"hit":""));
    h+='<div class="col'+(isT?' today':'')+(c.k===(editKey||tk)?' sel':'')+'"'+(c.fut?'':' data-k="'+c.k+'"')+'><div class="bw">'+(c.fut?'':'<span class="v">'+lbl(c.v)+'</span>')+
      '<i class="bar '+cls+'" style="height:'+(hg*0.84).toFixed(0)+'px"></i></div><b class="dot"></b><span class="d">'+((j===0||isT||j===cols.length-1)?sd(c.d):'')+'</span></div>';
  });
  el.innerHTML=h+'</div>'+lineChart(m,log);
  var ch=el.querySelector(".chart"),tc=ch.querySelector(".sel")||ch.querySelector(".today");
  if(tc)ch.scrollLeft=Math.max(0,tc.offsetLeft-ch.clientWidth/2);else if(today>m.target)ch.scrollLeft=ch.scrollWidth;
}

/* ================= shelf ================= */
function status(b){
  var st=analyze(b);
  if(!st)return "not set up yet";
  if(st.done)return st.finK?"finished "+sd(pd(st.finK))+(st.daysTaken?" · "+plural(st.daysTaken,"day"):"")+(st.avg!=null?" · "+st.avg.toFixed(1)+" pages/day":""):"finished";
  return st.storyPct+"% of the story"+(st.target?" · finish by "+sd(st.target):"");
}
function name(b){return b.f.title.trim()||"untitled book"}
function curRow(b){
  return '<div class="bk cur" data-setup="1"><div class="bkm"><div class="t"><span class="tn">'+esc(name(b))+'</span><span class="tag">open</span></div><div class="s">'+status(b)+'</div></div><i class="chev'+(setupOpen?' on':'')+'">›</i></div>';
}
function otherRow(b){
  return '<div class="bk"><div class="bkm"><div class="t"><span class="tn">'+esc(name(b))+'</span></div><div class="s">'+status(b)+'</div></div><div class="acts">'+
    '<button type="button" class="pill" data-open="'+b.id+'">open</button><button type="button" class="pill" data-del="'+b.id+'" aria-label="delete '+esc(name(b))+'">delete</button></div></div>';
}
function renderShelf(){
  var cur=B(),others=[],done=[];
  shelf.books.forEach(function(b){if(b===cur)return;var st=analyze(b);if(st&&st.done)done.push({b:b,k:st.finK||""});else others.push(b)});
  done.sort(function(a,b){return a.k<b.k?1:-1});
  $("shCur").innerHTML=curRow(cur);
  $("setupWrap").hidden=!setupOpen;
  $("othersWrap").hidden=!others.length;
  $("shOthers").innerHTML=others.map(otherRow).join("");
  $("shDone").innerHTML=done.length?done.map(function(x){return otherRow(x.b)}).join(""):'<p class="hint" style="margin:0">no finished books yet.</p>';
  $("bkInfo").textContent=shelf.lastBackup?"last backup: "+longD(pd(shelf.lastBackup))+".":"no backup yet. a backup keeps your books safe if this browser’s data gets cleared or you switch phones.";
}
function renderSetupInfo(m){
  var msg=$("msg");msg.hidden=m.state!=="error";msg.textContent=m.state==="error"?m.err:"";
  var out=$("out");
  if(m.state==="setup"||m.state==="error"){out.innerHTML="";return}
  var q=Math.ceil(m.ideal),f=B().f;
  out.innerHTML='<details class="opd"'+(opOpen?' open':'')+'><summary><h2>original plan</h2><span class="opq">'+fmt(q)+' page'+(q===1?'':'s')+' a day<i>›</i></span></summary>'+
    '<div class="answer"><span class="n">'+fmt(q)+'</span><span class="u">page'+(q===1?'':'s')+' a day</span><p>'+plural(m.planPages,'story page')+' over '+plural(m.totDays,'day')+', '+sd(m.startD)+' to '+sd(m.target)+'.</p></div><dl>'+
    '<dt>Ideal pace</dt><dd>'+m.ideal.toFixed(1)+' pages ('+P(m.ideal,m.total)+' of book)</dd>'+
    (m.mpp>0?'<dt>Reading time per day</dt><dd>about '+fmtMin(m.ideal*m.mpp)+'</dd>':'')+
    '<dt>Story length</dt><dd>'+plural(m.end-m.start+1,'page')+'</dd>'+
    '<dt>Front and back matter (skipped)</dt><dd>'+plural(m.start-1+Number(f.total)-m.end,'page')+'</dd>'+
    '<dt>Started from</dt><dd>Page '+fmt(m.sp)+'</dd></dl></details>';
}

/* ================= top bar + tabs ================= */
function segHTML(){
  function b(u,l){var on=unit===u;return '<button type="button" data-u="'+u+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'">'+l+'</button>'}
  return '<div class="seg" role="group" aria-label="show amounts in">'+b("pages","pages")+b("pct","percent")+'</div>';
}
function renderTop(){
  var S=curTab==="S";
  $("setBtn").hidden=!S;$("newBtn").hidden=!S;$("finBtn").hidden=!S;
  $("topSeg").innerHTML=ctx?segHTML():"";
  $("topSeg").hidden=S||!ctx;
}
function tab(n){
  curTab=n;
  [["T","vT"],["L","vL"],["S","vS"]].forEach(function(p){$(p[1]).hidden=p[0]!==n});
  [].forEach.call(document.querySelectorAll(".tabs button"),function(b){var on=b.dataset.tab===n;b.classList.toggle("on",on);b.setAttribute("aria-selected",on)});
  renderTop();window.scrollTo(0,0);
}
function openSetup(){setupOpen=true;render();tab("S")}

/* ================= render everything ================= */
function render(){
  var b=B(),t=b.f.title.trim();
  $("bt").textContent=t;$("bt").hidden=!t;
  var m=compute(b);
  ctx=m.ctx||null;
  renderToday(m);renderLog();renderPlan(m);renderSetupInfo(m);renderShelf();renderTop();
}

/* ================= book actions ================= */
function newBook(){var b=blank();shelf.books.push(b);shelf.cur=b.id;fillForm();save();openSetup();$("title").focus()}
function openBook(id){
  shelf.cur=id;fillForm();closeSheets();save();
  if(isReady()){setupOpen=false;render();tab("T")}else openSetup();
}
function delBook(id){
  snap();
  shelf.books=shelf.books.filter(function(b){return b.id!==id});
  if(!shelf.books.length)shelf.books.push(blank());
  if(!shelf.books.some(function(b){return b.id===shelf.cur})){
    var nxt=shelf.books.filter(function(b){var s=analyze(b);return !s||!s.done})[0]||shelf.books[0];
    shelf.cur=nxt.id;setupOpen=false;
  }
  fillForm();render();save();toast("book deleted");
}
function setUnit(u){
  if(u===unit)return;
  var pg=lpDirty&&ctx?(lpPin!=null?lpPin:lpPage()):NaN;
  unit=u;shelf.unit=u;render();save();
  if(!isNaN(pg)){$("lpv").value=toUnit(pg);lpDirty=true;lpPin=pg;updPct()}
}
/* two-tap confirm for destructive buttons */
function armed(btn,label){
  if(btn.classList.contains("armed"))return true;
  var old=btn.textContent;btn.classList.add("armed");btn.textContent=label;
  setTimeout(function(){if(btn.classList.contains("armed")){btn.classList.remove("armed");btn.textContent=old}},4000);
  return false;
}

/* ================= undo toast ================= */
var snapStr=null,toastT=0;
function snap(){snapStr=JSON.stringify(shelf)}
function toast(msg){
  $("toastMsg").textContent=msg;$("toast").hidden=false;clearTimeout(toastT);
  toastT=setTimeout(function(){$("toast").hidden=true;snapStr=null},10000);
}
$("toastUndo").addEventListener("click",function(){
  if(!snapStr)return;
  shelf=normShelf(JSON.parse(snapStr));unit=shelf.unit;snapStr=null;
  fillForm();render();save();$("toast").hidden=true;clearTimeout(toastT);
});

/* ================= sheets ================= */
function openSheet(id){$(id).classList.add("open");$(id).scrollTop=0;document.body.classList.add("modal")}
function closeSheets(){["finSheet","setSheet"].forEach(function(id){$(id).classList.remove("open")});document.body.classList.remove("modal")}

/* ================= widget (scriptable) ================= */
function syncWidget(){
  var b=B(),d={v:1,f:b.f,log:b.log,base0:b.base0,unit:unit,synced:new Date().toISOString()};
  window.location.href="scriptable:///run/"+encodeURIComponent(WIDGET_SCRIPT)+"?data="+encodeURIComponent(JSON.stringify(d));
}

/* ================= backup ================= */
function backupText(){return JSON.stringify({app:"reading-tracker",version:2,exported:new Date().toISOString(),books:shelf.books,cur:shelf.cur},null,1)}
function markBackup(m){shelf.lastBackup=ymd(today);save();renderShelf();$("bkMsg").textContent=m}
$("bkDl").addEventListener("click",function(){
  try{
    var blob=new Blob([backupText()],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="reading-tracker-backup-"+ymd(today)+".json";
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
    markBackup("backup file saved. keep it somewhere safe, like your files app or google drive.");
  }catch(e){$("bkMsg").textContent="couldn’t download here. try copy instead."}
});
$("bkCopy").addEventListener("click",function(){
  var txt=backupText(),ok=function(){markBackup("backup copied. paste it into a note or email to yourself.")};
  function fallback(){
    var ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();var done=false;try{done=document.execCommand("copy")}catch(e){}ta.remove();
    if(done)ok();else $("bkMsg").textContent="couldn’t copy here. try download instead.";
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();
});
$("bkOpen").addEventListener("click",function(){$("bkRestore").hidden=!$("bkRestore").hidden;$("bkMsg").textContent=""});
$("bkFile").addEventListener("change",function(){
  var file=this.files&&this.files[0];if(!file)return;
  var r=new FileReader();r.onload=function(){$("bkText").value=String(r.result||"")};r.readAsText(file);
});
$("bkGo").addEventListener("click",function(){
  var o;try{o=JSON.parse($("bkText").value.trim())}catch(e){o=null}
  if(!o||typeof o!=="object"||!(Array.isArray(o.books)||"total" in o||"log" in o)){$("bkMsg").textContent="that doesn’t look like a reading tracker backup.";return}
  var keep=shelf.lastBackup;snap();
  shelf=normShelf(o);if(!shelf.lastBackup)shelf.lastBackup=keep;unit=shelf.unit;
  fillForm();render();save();
  $("bkText").value="";$("bkFile").value="";$("bkRestore").hidden=true;
  $("bkMsg").textContent="restored "+plural(shelf.books.length,"book")+".";toast("backup restored");
});

/* ================= events ================= */
FIELDS.forEach(function(id){
  ["input","change"].forEach(function(ev){$(id).addEventListener(ev,function(){B().f[id]=this.value;render();save()})});
});
$("lpv").addEventListener("input",function(){lpDirty=true;lpPin=null;updPct()});
$("lpv").addEventListener("keydown",function(e){if(e.key==="Enter")saveLp()});
$("lpsave").addEventListener("click",saveLp);
$("lpcancel").addEventListener("click",function(){editKey="";lpDirty=false;render()});
$("syncW").addEventListener("click",syncWidget);
$("delCur").addEventListener("click",function(){if(armed(this,"tap again to delete"))delBook(B().id)});
$("setBtn").addEventListener("click",function(){openSheet("setSheet")});
$("finBtn").addEventListener("click",function(){openSheet("finSheet")});
$("newBtn").addEventListener("click",newBook);
document.addEventListener("toggle",function(e){if(e.target.classList&&e.target.classList.contains("opd"))opOpen=e.target.open},true);
$("plan").addEventListener("click",function(e){
  var c=e.target.closest(".col[data-k]");if(!c)return;
  editKey=c.dataset.k;lpDirty=false;render();tab("T");
});
document.addEventListener("click",function(e){
  var t=e.target,b;
  if((b=t.closest("[data-tab]"))){tab(b.dataset.tab);return}
  if((b=t.closest(".seg button[data-u]"))){setUnit(b.dataset.u);return}
  if(t.closest("[data-close]")){closeSheets();return}
  if(t.closest("[data-setup]")){setupOpen=!setupOpen;renderShelf();return}
  if((b=t.closest("[data-open]"))){openBook(b.dataset.open);return}
  if((b=t.closest("[data-del]"))){if(armed(b,"sure?"))delBook(b.dataset.del);return}
  if((b=t.closest("[data-ext]"))){var bk=B();bk.f.date=ymd(addDays(today,Number(b.dataset.ext)-1));$("date").value=bk.f.date;render();save();tab("T");return}
  if(t.closest("[data-go]")){openSetup();return}
  if(t.closest("[data-act=new]")){newBook();return}
});

/* keep "today" current when the app is left open past midnight */
function checkDay(){
  var t=midnight(new Date());
  if(t.getTime()!==today.getTime()){today=t;$("date").min=ymd(today);editKey="";lpDirty=false;render()}
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkDay()});
window.addEventListener("focus",checkDay);
window.addEventListener("pageshow",checkDay);
setInterval(checkDay,60000);

/* ================= start ================= */
load();fillForm();$("date").min=ymd(today);
render();
if(isReady())tab("T");else openSetup();
})();
</script>
<script>
/* block pinch-zoom */
["gesturestart","gesturechange","gestureend"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault()},{passive:false})});
document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});

/* version + auto-update: when the app opens, fetch the live page and reload if its version is newer */
(function(){
  var VERSION=document.querySelector('meta[name="app-version"]').content,last=0;
  document.getElementById("appVer").textContent="version "+VERSION;
  function check(manual){
    if(!manual&&Date.now()-last<30000)return;
    last=Date.now();
    fetch("./index.html?check="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
      var m=t.match(/name="app-version" content="([^"]+)"/);
      if(m&&m[1]!==VERSION){location.replace(location.pathname.replace(/index\.html$/,"")+"?v="+encodeURIComponent(m[1]));return}
      if(manual)alert("You're on the latest version ("+VERSION+").");
    }).catch(function(){if(manual)alert("Couldn't check for updates. Try again when you're online.")});
  }
  document.getElementById("updBtn").addEventListener("click",function(){check(true)});
  document.addEventListener("visibilitychange",function(){if(!document.hidden)check(false)});
  check(false);
})();
</script>
